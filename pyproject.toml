[project]
name = "dux_digital_signature"
authors = [
    { name = "Dux Digitech", email = "support@duxdigitech.com" }
]
description = "Reusable text-based digital signature support for Frappe and ERPNext documents"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "PyQRCode>=1.2.1",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
